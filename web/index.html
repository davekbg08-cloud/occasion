<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Occasion, plateforme d'achat et de vente d'articles.">

  <!-- Couleur de la barre d'adresse/barre de statut (navigateur ET PWA
       installée "Ajouter à l'écran d'accueil") : doit correspondre au fond
       réel de l'app (AppColors.background, lib/theme/app_theme.dart),
       jamais rester sur #0175C2 (bleu par défaut du gabarit `flutter
       create`, jamais personnalisé jusqu'ici) — sinon Android peint un
       bandeau dans cette couleur erronée par-dessus le contenu réel,
       visible comme une zone floue/décalée en haut de l'écran. -->
  <meta name="theme-color" content="#0F1720">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Occasion">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Occasion</title>
  <link rel="manifest" href="manifest.json">

  <!-- Écran d'attente pendant le chargement de l'app, selon le mode du
       téléphone : page blanche et logo d'origine (mode clair), fond sombre
       de l'app et logo clair (mode sombre) — identique au premier écran de
       chargement de l'app, retirée dès la première image Flutter. Sans
       lui : page vide le temps du chargement. -->
  <style>
    html, body { margin: 0; background: #fff; }
    #occasion-splash {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: #fff; transition: opacity 250ms ease-out;
    }
    #occasion-splash img {
      width: 160px; height: 160px;
      animation: occasion-splash-in 450ms cubic-bezier(0.33, 1, 0.68, 1);
    }
    @keyframes occasion-splash-in {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    @media (prefers-color-scheme: dark) {
      html, body, #occasion-splash { background: #0F1720; }
    }
    @media (prefers-reduced-motion: reduce) {
      #occasion-splash, #occasion-splash img { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <div id="occasion-splash" aria-hidden="true">
    <picture>
      <source srcset="branding/occasion_logo_dark.png" media="(prefers-color-scheme: dark)">
      <img src="branding/occasion_logo.png" alt="">
    </picture>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('occasion-splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Nettoyage ponctuel : un visiteur ayant chargé un déploiement antérieur au
    passage à `--pwa-strategy=none` (voir .github/workflows/deploy-pages.yml)
    peut encore avoir l'ancien service worker Flutter actif dans son
    navigateur. Ce service worker continuerait de servir indéfiniment sa
    version en cache de main.dart.js, même après ce correctif — puisque rien
    ne le désinscrit jamais de lui-même. Ce script le désinscrit et vide ses
    caches une bonne fois pour toutes.

    IMPORTANT : gardé derrière un drapeau localStorage pour ne s'exécuter
    qu'UNE SEULE fois par navigateur. Sans ce garde-fou, ce nettoyage
    tournerait à chaque chargement de page et désinscrirait aussi
    firebase-messaging-sw.js (voir lib/services/notification_service.dart) —
    rendant les notifications push web impossibles à chaque nouvelle visite.
  -->
  <script>
    if (!localStorage.getItem('sw_cleanup_v1_done')) {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((registration) => registration.unregister());
        });
      }
      if ('caches' in window) {
        caches.keys().then((keys) => {
          keys.forEach((key) => caches.delete(key));
        });
      }
      localStorage.setItem('sw_cleanup_v1_done', '1');
    }
  </script>
  <!--
    Mise à jour de la PWA : GitHub Pages met les fichiers en cache (10 min)
    et une PWA installée peut rester ouverte en arrière-plan des heures —
    un déploiement restait alors invisible. `__OCCASION_BUILD__` est
    remplacé au déploiement par l'identifiant du commit (voir
    .github/workflows/deploy-pages.yml, qui publie aussi build-id.txt). À
    l'ouverture, au retour dans l'app et toutes les 30 min, on compare avec
    build-id.txt (jamais mis en cache) ; si une version plus récente est en
    ligne, un bandeau propose de mettre à jour : on recharge alors les
    fichiers de l'app en contournant le cache, puis la page.
  -->
  <style>
    #occasion-update {
      position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px);
      left: 50%; transform: translateX(-50%); z-index: 2147483647;
      border: 0; border-radius: 22px; padding: 11px 18px;
      background: #14C8B4; color: #0F1720; font: 600 14px/1.2 Roboto, Arial, sans-serif;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); cursor: pointer;
      max-width: calc(100vw - 32px);
    }
  </style>
  <script>
    (function () {
      var current = '__OCCASION_BUILD__';
      if (current.indexOf('__') === 0) return; // build local, non déployé
      var shown = false;
      var updating = false;

      function update(button) {
        if (updating) return;
        updating = true;
        if (button) button.textContent = 'Mise à jour…';
        var files = ['./', 'index.html', 'flutter_bootstrap.js', 'main.dart.js'];
        Promise.all(files.map(function (url) {
          return fetch(url, { cache: 'reload' }).catch(function () {});
        })).then(function () { location.reload(); });
      }

      function showBanner() {
        if (shown) return;
        shown = true;
        var button = document.createElement('button');
        button.id = 'occasion-update';
        button.type = 'button';
        button.textContent = 'Nouvelle version disponible — Mettre à jour';
        button.addEventListener('click', function () { update(button); });
        document.body.appendChild(button);
      }

      function check() {
        fetch('build-id.txt?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.text() : null; })
          .then(function (latest) {
            latest = latest && latest.trim();
            if (latest && latest !== current) showBanner();
          })
          .catch(function () {});
      }

      setTimeout(check, 2000);
      setInterval(check, 30 * 60 * 1000);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') check();
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
