name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java (required by the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Firestore rules test dependencies
        run: npm install
        working-directory: firestore-tests

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore rules tests against emulator
        run: firebase emulators:exec --only firestore --project demo-occasion "npm --prefix firestore-tests test"

      - name: Build web release
        # --pwa-strategy=none : ne génère pas de service worker Flutter. Le
        # service worker par défaut (offline-first) sert la version mise en
        # cache tant qu'un rechargement ultérieur ne l'a pas remplacée, donc
        # un déploiement pouvait rester invisible pour un visiteur déjà venu
        # sur le site. GitHub Pages ne permet pas de configurer de
        # Cache-Control personnalisé pour compenser autrement.
        run: flutter build web --release --base-href /occasion/ --pwa-strategy=none

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
