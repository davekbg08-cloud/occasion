name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  verify:
    name: Verify (format, analyze, test, rules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java (required by the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Firestore rules test dependencies
        run: npm install
        working-directory: firestore-tests

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore rules tests against emulator
        run: firebase emulators:exec --only firestore --project demo-occasion "npm --prefix firestore-tests test"
