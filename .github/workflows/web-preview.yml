name: Aperçu web (Firebase Hosting)

# Publie la version actuelle de main sur un canal d'aperçu Firebase
# Hosting (lien stable « refonte », valable 30 jours). Lancement manuel.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --pwa-strategy=none
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Déployer l'aperçu
        run: |
          npm install -g firebase-tools
          firebase hosting:channel:deploy refonte --expires 30d --project occasion-10cdb --non-interactive
