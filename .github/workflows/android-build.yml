name: Build Android (vérification)

# Compile l'APK release à chaque push touchant l'app, SANS signature de
# production ni publication (aucun secret utilisé) : détecte au plus tôt ce
# que les tests Dart ne voient pas — Gradle, plugin google-services
# (ressources Firebase générées depuis google-services.json), R8,
# dépendances natives. La publication reste exclusivement manuelle
# (release-android.yml).
on:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - run: flutter pub get

      # Sans android/key.properties, build.gradle.kts signe avec la clé de
      # debug : suffisant pour vérifier la compilation, jamais publiable.
      - name: Construire l'APK release
        run: flutter build apk --release

      - name: Vérifier les ressources Firebase générées (google-services)
        run: |
          values=$(grep -rl 'name="google_app_id"' build/app/generated --include=values.xml | head -1)
          test -n "$values" || { echo "::error::values.xml google-services introuvable"; exit 1; }
          for key in google_app_id google_api_key project_id gcm_defaultSenderId google_storage_bucket firebase_database_url; do
            grep -q "name=\"$key\"" "$values" || { echo "::error::$key absent de $values"; exit 1; }
          done
          grep -o 'name="google_app_id"[^<]*<' "$values"
          grep -o 'name="firebase_database_url"[^<]*<' "$values"
