name: Refonte UI - verification

# Workflow TEMPORAIRE de la branche refonte-ui : formate le code, lance
# l'analyse et les tests, puis commite le rapport sur la branche (lisible
# sans accès aux logs). À supprimer avant la fusion dans main.
on:
  push:
    branches:
      - refonte-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format, analyse, tests
        run: |
          mkdir -p .ci-report
          dart format . > /dev/null
          { echo "commit: $(git rev-parse --short HEAD)"; echo "== ANALYZE"; flutter analyze --fatal-infos --fatal-warnings 2>&1 | tail -80; echo "analyze_exit=${PIPESTATUS[0]}"; echo "== TEST"; flutter test 2>&1 | tail -40; echo "test_exit=${PIPESTATUS[0]}"; } > .ci-report/refonte.txt 2>&1 || true
      - name: Commit formatage et rapport
        run: |
          git config user.name "ci-refonte"
          git config user.email "ci-refonte@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "ci: formatage + rapport de vérification [skip ci]"
          git push

  preview:
    # Aperçu web de la refonte sur un canal Firebase Hosting temporaire
    # (7 jours) — n'affecte pas le site de production.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refonte-ui
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --pwa-strategy=none
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Déployer l'aperçu
        run: |
          npm install -g firebase-tools
          firebase hosting:channel:deploy refonte --expires 7d --project occasion-10cdb --non-interactive --json > preview.json || true
          python3 -c "import json;d=json.load(open('preview.json'));r=d.get('result',{});print('status:',d.get('status'));[print('url:',v.get('url')) for v in r.values()] if isinstance(r,dict) else print(d)" > .ci-report/preview.txt 2>&1 || cat preview.json > .ci-report/preview.txt
          cat .ci-report/preview.txt
      - name: Publier le lien
        run: |
          git config user.name "ci-refonte"
          git config user.email "ci-refonte@users.noreply.github.com"
          git add .ci-report/preview.txt
          git diff --cached --quiet || git commit -m "ci: lien d'aperçu [skip ci]"
          git pull --rebase
          git push
