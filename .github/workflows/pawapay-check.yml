name: Pawapay - verification

# Workflow TEMPORAIRE de la branche pawapay : formate le code, lance
# l'analyse et les tests, puis commite le rapport sur la branche (lisible
# sans accès aux logs). À supprimer avant la fusion dans main.
on:
  push:
    branches:
      - pawapay
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format, analyse, tests
        run: |
          mkdir -p .ci-report
          dart format . > /dev/null
          { echo "commit: $(git rev-parse --short HEAD)"; echo "== ANALYZE"; flutter analyze --fatal-infos --fatal-warnings 2>&1 | tail -80; echo "analyze_exit=${PIPESTATUS[0]}"; echo "== TEST"; flutter test 2>&1 | tail -40; echo "test_exit=${PIPESTATUS[0]}"; } > .ci-report/refonte.txt 2>&1 || true
      - name: Commit formatage et rapport
        run: |
          git config user.name "ci-refonte"
          git config user.email "ci-refonte@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "ci: formatage + rapport de vérification [skip ci]"
          git push

